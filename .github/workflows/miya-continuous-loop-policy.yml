name: MIYA continuous loop policy unit tests

on:
  pull_request:
    branches: [miya-ai-dev]
    paths:
      - 'scripts/miya/continuous-loop-policy.mjs'
      - 'scripts/miya/continuous-loop-policy.node.test.mjs'
      - 'scripts/miya/codex-github-dispatch.mjs'
      - 'scripts/miya/codex-github-dispatch.node.test.mjs'
      - '.github/workflows/miya-continuous-loop-policy.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: '24'
      - name: Check pure-loop policy syntax
        run: node --check scripts/miya/continuous-loop-policy.mjs
      - name: Run pure-loop policy security tests
        run: node --test scripts/miya/continuous-loop-policy.node.test.mjs scripts/miya/codex-github-dispatch.node.test.mjs
