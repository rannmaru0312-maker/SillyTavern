name: MIYA AI Development Check
on:
  pull_request:
    branches: [miya-ai-dev]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
concurrency:
  group: miya-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 24
      - name: Check development scope and credential patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/miya/check-development.mjs "$BASE_SHA" "$HEAD_SHA"
      - run: npm ci --ignore-scripts
      - run: npm --prefix tests ci --ignore-scripts
      - name: Lint changed JavaScript including ignored plugins
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/miya/check-development.mjs "$BASE_SHA" "$HEAD_SHA" --lint
      - name: Run Jest serially
        run: npm --prefix tests run test:unit -- --runInBand
