name: MIYA Safe Handoff Validation
on:
  pull_request:
    branches: [miya-ai-dev]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout development code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/miya/handoff-core.mjs
          node --check scripts/miya/handoff-cli.mjs
      - name: Validate machine-readable handoff tickets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tickets=(.github/miya/handoffs/MIYA-AUTO-*.json)
          if (( ${#tickets[@]} == 0 )); then
            echo 'No handoff files in this PR; nothing to validate.'
          else
            node scripts/miya/handoff-cli.mjs "${tickets[@]}"
          fi
      - name: Unit tests for handoff policy
        run: node --test scripts/miya/handoff-core.node.test.mjs
