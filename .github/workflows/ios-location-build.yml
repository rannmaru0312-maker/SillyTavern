name: MIYA Location iOS simulator build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios-location/**'
      - '.github/workflows/ios-location-build.yml'
concurrency:
  group: miya-ios-location-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios-location && xcodegen generate
      - name: Build unsigned simulator target
        run: |
          xcodebuild -project ios-location/MIYALocation.xcodeproj -scheme MIYALocation -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Test seven-day exporter on iOS simulator
        timeout-minutes: 8
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; matches=[d["udid"] for items in data.values() for d in items if d.get("name","").startswith("iPhone") and d.get("isAvailable",True)]; print(matches[0] if matches else "")')"
          test -n "$SIM_ID" || { echo "No available iPhone simulator; cannot claim test success"; exit 1; }
          echo "Testing iOS unit tests on simulator: $SIM_ID"
          xcodebuild -project ios-location/MIYALocation.xcodeproj \
            -scheme MIYALocation -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -only-testing:MIYALocationTests \
            CODE_SIGNING_ALLOWED=NO \
            -quiet test
