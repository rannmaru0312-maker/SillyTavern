name: OwnTracks public geocoder smoke (public landmark only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'owntracks-receiver/geo/**'
      - '.github/workflows/owntracks-geo-public-smoke.yml'

permissions:
  contents: read

jobs:
  synthetic-and-one-public-gsi-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node 22
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '22'
      - name: Offline geo tests (no external network)
        run: node --test owntracks-receiver/geo/*.test.mjs
      - name: Check GSI on a fixed public landmark, never user coordinates
        id: public_geo
        continue-on-error: true
        env:
          MIYA_PUBLIC_GSI_SMOKE: '1'
        run: node owntracks-receiver/geo/public-gsi-smoke.mjs
      - name: Report whether actual API was reachable
        if: always()
        run: echo "GSI public smoke result = ${{ steps.public_geo.outcome }}. Failure does not imply GPS logging failure."